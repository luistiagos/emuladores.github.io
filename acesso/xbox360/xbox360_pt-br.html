<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:title" content=""/>
    <meta property="og:description" content=""/>
    <meta property="og:image" content=""/>
    <meta property="og:url" content=""/>
    <meta name="twitter:card" content="none">
    <title>Xbox 360 (ISO)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 1rem;
            font-size: 1rem;
        }
        #searchInput {
            max-width: 100%;
            font-size: 1rem;
        }
        table {
            font-size: 0.95rem;
            word-break: break-word;
        }
        a {
            word-break: break-word;
        }
        @media (max-width: 576px) {
            h2 {
                font-size: 1.2rem;
            }
            table td, table th {
                font-size: 0.5rem;
                padding: 0.5rem;
            }
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="container-fluid mt-3">

    <h2 class="text-center">Xbox 360 Traduzidos (ISO)</h2>

    <!-- Search box -->
    <div class="mb-3">
        <input type="text" id="searchInput" class="form-control" placeholder="Search for a game...">
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover">
            <thead class="table-light">
                <tr>
                    <th>Game</th>
                    <th>Size</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td><a href="https://huggingface.co/datasets/luistiagos/xbx/resolve/main/FABLE%203%20PT-BR.rar" referrerpolicy="no-referrer">Fable 3</a></td><td>5.3 GB</td></tr>
                <tr><td><a href="https://huggingface.co/datasets/luistiagos/xbx/resolve/main/Mass%20Effect%202%20%2B%20PT-BR%20%2B%20DLC.rar" referrerpolicy="no-referrer">Mass Effect 2 + PT-BR + DLC</a></td><td>14.0 GB</td></tr>
                <tr><td><a href="https://huggingface.co/datasets/luistiagos/xbx/resolve/main/METAL%20GEAR%20SOLID%20V%20THE%20PHANTOM%20PAIN%20PT%20BR.rar" referrerpolicy="no-referrer">METAL GEAR SOLID V THE PHANTOM PAIN</a></td><td>9.5 GB</td></tr>
                <tr><td><a href="https://huggingface.co/datasets/luistiagos/xbx/resolve/main/RESIDENT%20EVIL%200%20HD%20REMASTER%20PT-BR%20(RGH).rar" referrerpolicy="no-referrer">RESIDENT EVIL 0 HD REMASTER</a></td><td>3.3 GB</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        $(document).ready(function () {
            $("#searchInput").on("keyup", function () {
                var value = $(this).val().toLowerCase();
                $("#tableBody tr").filter(function () {
                    $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1);
                });
            });
        });
    </script>
</body>
</html>
